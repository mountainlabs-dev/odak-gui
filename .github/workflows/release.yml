# Builds the store packages on every version tag (git tag v0.5.0 && git push --tags),
# on pull requests (build only), or by hand from the Actions tab.
#
#   Linux:   .deb (GitHub release) and .snap (Snap Store / Ubuntu App Center)
#   Windows: .appx (Microsoft Store) and Setup.exe (GitHub release)
#   macOS:   .dmg for Intel and Apple Silicon (GitHub release; unsigned until there is an Apple
#            Developer ID, so the first launch needs right-click > Open)
#
# Repository settings it reads (Settings > Secrets and variables > Actions); the MSSTORE_* ones are
# optional and override the Store identity in packaging/windows/store.js:
#   secrets.SNAPCRAFT_STORE_CREDENTIALS   from `snapcraft export-login` (optional: without it the
#                                         snap is built but not uploaded)
#   vars.MSSTORE_IDENTITY_NAME            Partner Center > Product identity > Package/Identity/Name
#   vars.MSSTORE_PUBLISHER                ... Package/Identity/Publisher (CN=...)
#   vars.MSSTORE_PUBLISHER_DISPLAY_NAME   ... Package/Properties/PublisherDisplayName
#   vars.MSSTORE_DISPLAY_NAME             the app name reserved in Partner Center
name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:        # build only: checks the packages before anything is released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - run: npm ci
      - name: Build .deb
        run: npx electron-forge make --targets @electron-forge/maker-deb
      - name: Prepare the snap
        run: |
          mv "out/Mountain Labs-linux-x64" out/linux-unpacked
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^version: .*/version: '$VERSION'/" snap/snapcraft.yaml
      - name: Build .snap
        id: snap
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/make/deb/x64/*.deb
            ${{ steps.snap.outputs.snap }}
      - name: Upload to the Snap Store (edge channel)
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: edge

  windows:
    runs-on: windows-latest
    env:
      MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
      MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
      MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Store re-signs the package; this throwaway certificate only lets testers sideload it.
      # Made here because the packager's own makecert step waits for a password dialog.
      - name: Make a test signing certificate
        shell: pwsh
        run: |
          $publisher = if ($env:MSSTORE_PUBLISHER) { $env:MSSTORE_PUBLISHER } else { 'CN=0FAAF412-56E3-45CB-B0D7-4AB33CBF5B5E' }
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Odak test signing' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'odak-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:GITHUB_WORKSPACE 'Odak-test-certificate.cer') | Out-Null
          "MSSTORE_DEV_CERT=$pfx" >> $env:GITHUB_ENV
          "MSSTORE_DEV_CERT_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: Build .appx and Setup.exe
        run: npx electron-forge make --targets @electron-forge/maker-appx,@electron-forge/maker-squirrel
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/make/appx/**/*.appx
            out/make/squirrel.windows/**/*.exe
            Odak-test-certificate.cer

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .dmg (Apple Silicon and Intel)
        run: |
          npx electron-forge make --targets @electron-forge/maker-dmg --arch=arm64
          npx electron-forge make --targets @electron-forge/maker-dmg --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/make/**/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft a GitHub release with every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Odak Air Quality Monitor ${GITHUB_REF_NAME#v}" --generate-notes \
            $(find dist -type f \( -name '*.deb' -o -name '*.snap' -o -name '*.appx' -o -name '*.exe' -o -name '*.dmg' \))
